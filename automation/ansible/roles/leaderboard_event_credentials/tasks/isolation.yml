---
- name: Require instructor isolation before handling the stored key
  block:
    - name: Measure instructor access to the organizer Secret using authorization reviews
      kubernetes.core.k8s:
        kubeconfig: "{{ aia_kubeconfig | default(omit) }}"
        state: present
        definition:
          apiVersion: authorization.k8s.io/v1
          kind: SubjectAccessReview
          spec:
            user: "{{ item }}"
            groups: "{{ aia_event_vault_probe_groups }}"
            resourceAttributes:
              namespace: "{{ aia_event_vault_secret_namespace }}"
              verb: get
              group: ''
              resource: secrets
              name: "{{ aia_event_vault_secret_name }}"
      loop: "{{ aia_event_vault_probe_users }}"
      register: _aia_leaderboard_access_reviews
      changed_when: false

    - name: Require real denials for every instructor probe
      ansible.builtin.assert:
        that:
          - aia_event_vault_probe_users | length > 0
          - _aia_leaderboard_access_reviews.results | length == aia_event_vault_probe_users | length
          - >-
            _aia_leaderboard_access_reviews.results | map(attribute='result.status.allowed') |
            select('equalto', false) | list | length == aia_event_vault_probe_users | length
          - >-
            _aia_leaderboard_access_reviews.results |
            map(attribute='result.status.evaluationError', default='') |
            reject('equalto', '') | list | length == 0

  always:
    - name: Clear authorization review results
      ansible.builtin.set_fact:
        _aia_leaderboard_access_reviews: {}
  no_log: true
  diff: false
