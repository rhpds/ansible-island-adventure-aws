---
# Showroom mounts this student's published fields here. CLI -e @file takes precedence.
- name: Load the selected student's Showroom provision fields when available
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Look for the Showroom user-data mount
      ansible.builtin.stat:
        path: "{{ aia_healthcheck_user_data_file | default('/user_data/user_data.yml') }}"
      register: health_user_data_mount
      when: guid is not defined

    - name: Load private Showroom student data without logging credentials
      ansible.builtin.include_vars:
        file: "{{ aia_healthcheck_user_data_file | default('/user_data/user_data.yml') }}"
      when:
        - guid is not defined
        - health_user_data_mount.stat.exists | default(false)
      no_log: true

- ansible.builtin.import_playbook: ../automation/ansible/healthcheck.yml
